<rml>
    <head>
        <title>
            Speech bubbles
        </title>
        <link type="text/rcss" href="../styles/html.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <style>
            body {
                z-index: -40;
            }
            speech-bubbles {
                display: block;
                position: absolute;
                width: 100%;
                height: 100%;
                pointer-events: none;
                font-size: 14dp;
                line-height: 20dp;
                font-effect: none;
            }
            .world-template-source {
                display: none;
            }
            .bubble {
                z-index: 0;
                position: relative;
                display: block;
                top: -64dp;
                width: 200dp;
                max-width: 100%;
                box-sizing: border-box;
                padding: 6dp 10dp;
            }
            .bubble-frame {
                z-index: -1;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                border: 2dp #858585;
                border-radius: 4dp;
                background-color: #eaeaeaf5;
            }
            .world-bubble-text {
                font-effect: none;
                display: block;
                text-align: center;
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 40dp;
                overflow: hidden;
            }
            .bubble[channel=party] .bubble-frame {
                border-color: #8cc8e1;
            }
            .bubble[channel=group] .bubble-frame {
                border-color: #6b749e;
                background-color: #d6dcedf5;
            }
            .bubble[channel=clan] .bubble-frame {
                border-color: #ffc85a;
            }
            .bubble[channel=shout] .bubble-frame {
                border-color: #ff4545;
            }
            .bubble-line {
                display: block;
            }
            .bubble-tail {
                position: absolute;
                top: 100%;
                margin-top: -2dp;
                left: 50%;
                margin-left: -6dp;
                width: 0;
                height: 0;
                border-left: 6dp transparent;
                border-right: 6dp transparent;
                border-top: 7dp #858585;
            }
            .bubble-tag {
                display: none;
                position: absolute;
                top: 100%;
                margin-top: -2dp;
                right: 0;
                padding: 0 5dp;
                border-radius: 0 0 3dp 3dp;
                color: white;
                background-color: #858585;
                font-size: 9dp;
                font-weight: 820;
                line-height: 12dp;
            }
            .bubble.has-tag .bubble-tag {
                display: block;
            }
            .bubble[channel=party] .bubble-tail {
                border-top-color: #8cc8e1;
            }
            .bubble[channel=party] .bubble-tag {
                background-color: #8cc8e1;
            }
            .bubble[channel=group] .bubble-tail {
                border-top-color: #6b749e;
            }
            .bubble[channel=group] .bubble-tag {
                background-color: #6b749e;
            }
            .bubble[channel=clan] .bubble-tail {
                border-top-color: #ffc85a;
            }
            .bubble[channel=clan] .bubble-tag {
                background-color: #ffc85a;
            }
            .bubble[channel=shout] .bubble-tail {
                border-top-color: #ff4545;
            }
            .bubble[channel=shout] .bubble-tag {
                background-color: #ff4545;
            }
        </style>
        <script>
            document:AddEventListener("world-template-created", function(created)
                local view = created.target_element
                if view:GetAttribute("world-template") ~= "speech" then
                    return
                end
                view:AddEventListener("worldupdate", function(event)
                    -- Keep explicit empty lines; each nonempty paragraph wraps in RCSS.
                    local text, position = event.parameters.text, 1
                    local body = view:QuerySelector(".world-bubble-text")
                    body.inner_rml = ""
                    while position <= #text do
                        local newline = text:find("\n", position, true)
                        local line = text:sub(position, newline and newline - 1 or #text)
                        local node = body:AppendChild(document:CreateElement("span"))
                        node.class_name = "bubble-line"
                        node:AppendChild(document:CreateTextNode((line:gsub("&", "&amp;"))))
                        position = newline and newline + 1 or #text + 1
                    end
                end)
                -- Round the line height to pixels; empty lines keep that height. Only
                -- changed values are written, so an unchanged bubble is not laid out twice.
                view:AddEventListener("worldlayout", function(event)
                    local height = tostring(math.floor(event.parameters.line_height + 0.5)) .. "px"
                    if view.style["line-height"] ~= height then
                        view.style["line-height"] = height
                    end
                    for _, line in ipairs(view:QuerySelectorAll(".bubble-line")) do
                        if line.style["min-height"] ~= height then
                            line.style["min-height"] = height
                        end
                    end
                end)
            end)
        </script>
    </head>
    <body class="ui-world-layer" id="speech-bubbles">
        <!-- Theme documents own wrapping and decoration; native code retains world anchoring. -->
        <speech-bubbles id="speech-bubbles-root">
            <div class="world-template-source">
                <div world-template="speech" class="bubble" anchor-x="0.5" anchor-y="1" clamp-to-viewport="true" world-class-monster="monster" world-class-has-tag="has_tag" world-attr-channel="channel">
                    <div class="bubble-frame"/>
                    <span class="world-bubble-text" world-text="text" world-color="color"/>
                    <div class="bubble-tail"/>
                    <span class="bubble-tag" world-text="tag"/>
                </div>
            </div>
        </speech-bubbles>
    </body>
</rml>
