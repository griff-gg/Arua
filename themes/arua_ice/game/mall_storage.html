<rml>
    <head>
        <title>Item Mall Purchase</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />
        <style>
            body { width: 353dp; max-width: 94vw; }
            #mall-storage #window-content { padding: 6dp; }
            /* Fixed eight-slot rows keep fractional scales from wrapping a column. */
            .mall-grid { width: 341dp; flex-direction: column; flex-wrap: nowrap; gap: 3dp; }
            .mall-row { display: flex; flex-wrap: nowrap; justify-content: space-between; }
            .mall-row item-slot { box-sizing: border-box; min-width: 0; margin: 0; }
            #mall-state { margin-top: 6dp; }
            .ui-actions { flex-wrap: nowrap; gap: 6dp; margin-top: 6dp; }
            .ui-actions > button.default { width: 84dp; min-width: 84dp; height: 24dp; padding: 1dp 5dp; line-height: 20dp; font-size: 13dp; }

            /* ===== ice theme ===== */
            body#mall-storage { width: 389dp; } /* grid 341 + ice box padding */
            #mall-storage #window-content { padding: 10dp 10dp 8dp 10dp; }
            #mall-storage .mall-grid {
                padding: 6dp;
                background-color: rgb(236, 244, 251);
                border: 1dp rgb(176, 206, 232);
                border-radius: 8dp;
            }
            #mall-storage .ui-selectable-slots item-slot:hover { border-color: rgb(120, 175, 225); }
            #mall-storage .ui-selectable-slots item-slot.selected { border-color: rgb(214, 166, 60); }
            #mall-storage #mall-state { color: rgb(70, 92, 128); }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/mall_storage.css" />
    </head>
    <body open-sound="5" close-sound="4" template="window-fixed-size" id="mall-storage">
        <div data-model="mall-storage">
        <div class="mall-grid ui-slot-grid ui-selectable-slots">
            <div class="mall-row">
                <item-slot id="mall-slot-0" data-class-selected="slots[0].selected" />
                <item-slot id="mall-slot-1" data-class-selected="slots[1].selected" />
                <item-slot id="mall-slot-2" data-class-selected="slots[2].selected" />
                <item-slot id="mall-slot-3" data-class-selected="slots[3].selected" />
                <item-slot id="mall-slot-4" data-class-selected="slots[4].selected" />
                <item-slot id="mall-slot-5" data-class-selected="slots[5].selected" />
                <item-slot id="mall-slot-6" data-class-selected="slots[6].selected" />
                <item-slot id="mall-slot-7" data-class-selected="slots[7].selected" />
            </div>
            <div class="mall-row">
                <item-slot id="mall-slot-8" data-class-selected="slots[8].selected" />
                <item-slot id="mall-slot-9" data-class-selected="slots[9].selected" />
                <item-slot id="mall-slot-10" data-class-selected="slots[10].selected" />
                <item-slot id="mall-slot-11" data-class-selected="slots[11].selected" />
                <item-slot id="mall-slot-12" data-class-selected="slots[12].selected" />
                <item-slot id="mall-slot-13" data-class-selected="slots[13].selected" />
                <item-slot id="mall-slot-14" data-class-selected="slots[14].selected" />
                <item-slot id="mall-slot-15" data-class-selected="slots[15].selected" />
            </div>
            <div class="mall-row">
                <item-slot id="mall-slot-16" data-class-selected="slots[16].selected" />
                <item-slot id="mall-slot-17" data-class-selected="slots[17].selected" />
                <item-slot id="mall-slot-18" data-class-selected="slots[18].selected" />
                <item-slot id="mall-slot-19" data-class-selected="slots[19].selected" />
                <item-slot id="mall-slot-20" data-class-selected="slots[20].selected" />
                <item-slot id="mall-slot-21" data-class-selected="slots[21].selected" />
                <item-slot id="mall-slot-22" data-class-selected="slots[22].selected" />
                <item-slot id="mall-slot-23" data-class-selected="slots[23].selected" />
            </div>
            <div class="mall-row">
                <item-slot id="mall-slot-24" data-class-selected="slots[24].selected" />
                <item-slot id="mall-slot-25" data-class-selected="slots[25].selected" />
                <item-slot id="mall-slot-26" data-class-selected="slots[26].selected" />
                <item-slot id="mall-slot-27" data-class-selected="slots[27].selected" />
                <item-slot id="mall-slot-28" data-class-selected="slots[28].selected" />
                <item-slot id="mall-slot-29" data-class-selected="slots[29].selected" />
                <item-slot id="mall-slot-30" data-class-selected="slots[30].selected" />
                <item-slot id="mall-slot-31" data-class-selected="slots[31].selected" />
            </div>
            <div class="mall-row">
                <item-slot id="mall-slot-32" data-class-selected="slots[32].selected" />
                <item-slot id="mall-slot-33" data-class-selected="slots[33].selected" />
                <item-slot id="mall-slot-34" data-class-selected="slots[34].selected" />
                <item-slot id="mall-slot-35" data-class-selected="slots[35].selected" />
                <item-slot id="mall-slot-36" data-class-selected="slots[36].selected" />
                <item-slot id="mall-slot-37" data-class-selected="slots[37].selected" />
                <item-slot id="mall-slot-38" data-class-selected="slots[38].selected" />
                <item-slot id="mall-slot-39" data-class-selected="slots[39].selected" />
            </div>
        </div>
        <div id="mall-state" class="ui-status" data-if="state != ''">{{ state }}</div>
        <div class="ui-actions">
            <button id="retrieve" class="default ice-primary" onclick="retrieve" data-attrif-disabled="!retrieve_enabled">Retrieve</button>
            <button id="refresh" class="default" onclick="refresh" data-attrif-disabled="!refresh_enabled">Refresh</button>
        </div>
        </div>
        <div class="ice-fx ice-tl small"></div>
        <div class="ice-fx ice-br small"></div>
    </body>
</rml>
