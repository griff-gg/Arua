<rml>
    <head>
        <style>
            body
            {
                margin: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                font-family: Nunito;
                font-size: 14px;
            }
            .bubble
            {
                position: absolute;
                left: 0;
                top: 0;
                width: 179px;
                height: 50px;
                transform-origin: 0px 0px;
                visibility: hidden;
                pointer-events: none;
            }
            img
            {
                position: absolute;
                left: 0;
                top: 0;
                width: 179px;
            }
            .message
            {
                position: absolute;
                left: 4px;
                top: 2px;
                white-space: pre;
            }
        </style>
    </head>
    <body id="chat-bubbles"></body>
</rml>
