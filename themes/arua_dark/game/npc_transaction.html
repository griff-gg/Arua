<rml>
    <head>
        <title>Transaction</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/spritesheet_currencyicon.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_sprites2.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />
        <style>
            body { width: 242dp; max-width: 94vw; }
            #npc-transaction #window-content { padding: 6dp; }
            .cart-section.content-box { padding: 6dp; margin-bottom: 6dp; }
            .cart-section .ui-section-title { margin-bottom: 4dp; }
            .cart-section .ui-footer { margin-top: 4dp; padding-top: 4dp; }
            #confirm { min-width: 100dp; height: 24dp; flex-shrink: 0; padding: 1dp 12dp; font-size: 13dp; line-height: 22dp; white-space: nowrap; }
            /* Explicit five-slot rows avoid rounding-driven wrapping at 95% scale. */
            .cart-grid { width: 216dp; flex-direction: column; flex-wrap: nowrap; }
            .cart-row { display: flex; flex-wrap: nowrap; gap: 4dp; }

            /* zulie: close-button style Z icon (atlas2) */
            body img[sprite="ice-zulie-n"] { width: 20dp; min-width: 20dp; height: 20dp; }
            body button.zulie { width: 20dp; min-width: 20dp; height: 20dp; decorator: image(ice-zulie-n); background-color: rgba(0, 0, 0, 0); border-width: 0dp; }
            body button.zulie:hover { decorator: image(ice-zulie-h); }
            body button.zulie:active { decorator: image(ice-zulie-a); }
            body button.zulie:disabled, body button.zulie[disabled] { decorator: image(ice-zulie-n); }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/npc_transaction.css" />
    </head>
    <body open-sound="5" close-sound="4" template="window-fixed-size" id="npc-transaction">
        <div data-model="npc-transaction">
        <div class="cart-section ui-section content-box">
            <div class="ui-section-title" id="buy-label">{{ buy_label }}</div>
            <div class="cart-grid ui-slot-grid" id="buy-slots">
                <div class="cart-row">
                    <item-slot id="cart-slot-0" />
                    <item-slot id="cart-slot-1" />
                    <item-slot id="cart-slot-2" />
                    <item-slot id="cart-slot-3" />
                    <item-slot id="cart-slot-4" />
                </div>
                <div class="cart-row">
                    <item-slot id="cart-slot-5" />
                    <item-slot id="cart-slot-6" />
                    <item-slot id="cart-slot-7" />
                    <item-slot id="cart-slot-8" />
                    <item-slot id="cart-slot-9" />
                </div>
            </div>
            <div class="ui-currency ui-footer"><img id="buy-currency" data-attr-sprite="buy_currency" /><span id="buy-total">{{ buy_total }}</span></div>
        </div>
        <div class="cart-section ui-section content-box">
            <div class="ui-section-title" id="sell-label">{{ sell_label }}</div>
            <div class="cart-grid ui-slot-grid" id="sell-slots">
                <div class="cart-row">
                    <item-slot id="cart-slot-10" />
                    <item-slot id="cart-slot-11" />
                    <item-slot id="cart-slot-12" />
                    <item-slot id="cart-slot-13" />
                    <item-slot id="cart-slot-14" />
                </div>
                <div class="cart-row">
                    <item-slot id="cart-slot-15" />
                    <item-slot id="cart-slot-16" />
                    <item-slot id="cart-slot-17" />
                    <item-slot id="cart-slot-18" />
                    <item-slot id="cart-slot-19" />
                </div>
            </div>
            <div class="ui-currency ui-footer"><img sprite="ice-zulie-n" /><span id="sell-total">{{ sell_total }}</span></div>
        </div>
        <div class="ui-actions">
            <button id="confirm" class="default ice-primary" onclick="confirm" data-attrif-disabled="!confirm_enabled">{{ confirm_label }}</button>
        </div>
        </div>
        <div class="ice-fx ice-tl small"></div>
        <div class="ice-fx ice-br small"></div>
    </body>
</rml>
