<rml>

    <head>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <link type="text/rcss" href="../styles/ice_sprites.css" />
        <link type="text/rcss" href="../styles/ice_sprites2.css" />
        <link type="text/rcss" href="../styles/ice_window.css" />

        <style>
            body {
                width: 304dp;
                font-size: 13dp;
            }


            #window-content {
                height: auto;
                padding: 4dp 3dp;
            }

            #main-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4dp;
            }

            #item-box-preview {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                gap: 6dp;
            }

            #item-box-preview>div {
                display: flex;
                justify-content: center;
            }

            #box-icon-container {
                width: 44dp;
                height: 44dp;
                text-align: center;
                align-items: center;
                background-color: rgba(50, 50, 50, 134);
                border-radius: 5dp;
            }

            #choice-label, #choice-message {
                text-align: center;
                font-size: 13dp;
                font-weight: bold;
                white-space: nowrap;
            }

            #choice-message {
                color: yellow;
            }

            #choice-container {
                width: 100%;
                box-sizing: border-box;
            }

            #choice-list {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 4dp;
            }

            .choice-item {
                width: 94dp;
                padding: 4dp;
                box-sizing: border-box;
                flex-shrink: 0;

                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2dp;
                text-align: center;
                background-color: rgba(50, 50, 50, 134);
            }

            .choice-item>item-slot {
                flex-shrink: 0;
            }

            .button-container {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 2dp;
            }

            .button-container>button {
                margin: 0;
                height: 24dp;
                flex-shrink: 0;
                padding: 2dp 2dp;
            }

            .button-container>.textarea {
                display: inline-block;
                width: 32dp;
                height: 24dp;
                padding: 0dp 1dp;
                line-height: 22dp;
                font-size: 13dp;
                text-align: center;
                white-space: nowrap;
                flex-shrink: 0;
            }

            #confirm {
                width: 88dp;
                min-width: 0;
                height: 24dp;
                padding: 1dp 10dp;
                line-height: 22dp;
                font-size: 13dp;
                font-weight: bold;
                color: yellow;
                white-space: nowrap;
            }

            /* ===== ice theme ===== */
            #game-choice-box #main-container { padding: 8dp; }
            /* the box being opened: white tile, gold edge */
            #game-choice-box #box-icon-container {
                display: flex; justify-content: center;
                background-color: rgb(255, 250, 232);
                border: 1dp rgb(214, 166, 60);
                border-radius: 8dp;
                padding-top: 4dp;
                box-sizing: border-box;
            }
            #game-choice-box #choice-label { color: rgb(30, 62, 112); font-effect: none; }
            #game-choice-box #choice-message { color: rgb(170, 100, 20); font-size: 16dp; font-effect: none; }
            #game-choice-box #choice-container { padding: 6dp; }
            /* each choice = white card; picked ones (quantity > 0) keep the same card */
            #game-choice-box .choice-item {
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(196, 218, 238);
                border-radius: 6dp;
                decorator: none;
            }
            #game-choice-box .choice-item:hover { border-color: rgb(120, 175, 225); background-color: rgb(246, 251, 255); }
            #game-choice-box .choice-item item-slot { margin: 2dp auto 4dp auto; }
            #game-choice-box .button-container > .textarea {
                display: block;
                width: 40dp; height: 20dp; line-height: 14dp;
                margin: 0dp 4dp;
                box-sizing: border-box;
                padding: 2dp;
                background-color: rgb(255, 255, 255);
                border: 1dp rgb(176, 206, 232);
                border-radius: 5dp;
                color: rgb(30, 62, 112);
                font-weight: 820;
                decorator: none;
            }
            #game-choice-box button.left-sm,
            #game-choice-box button.right-sm { margin: 0dp; width: 20dp; min-width: 20dp; height: 20dp; }
            #game-choice-box button.left-sm { decorator: image(ice-left-n); }
            #game-choice-box button.left-sm:hover { decorator: image(ice-left-h); }
            #game-choice-box button.left-sm:active { decorator: image(ice-left-a); }
            #game-choice-box button.right-sm { decorator: image(ice-right-n); }
            #game-choice-box button.right-sm:hover { decorator: image(ice-right-h); }
            #game-choice-box button.right-sm:active { decorator: image(ice-right-a); }
            #game-choice-box #confirm { color: rgb(92, 50, 8); font-size: 15dp; min-width: 150dp; }
            #game-choice-box #confirm:not([disabled]):hover { color: rgb(30, 62, 112); }
        </style>
        <link type="text/rcss" href="../styles/ice_sprites_dark.css" />
        <link type="text/rcss" href="../styles/dark/choice_box.css" />
    </head>

    <body id="game-choice-box" template="window-fixed-size">
        <div id="main-container" data-model="item-box">
            <div id="item-box-preview">
                <div id="box-icon-container">
                    <item-slot item-actions id="box-icon" data-attr-item="item_box.ref_key" data-attr-item-quantity="item_box.quantity"></item-slot>
                </div>
                <label id="choice-label">{{choice_quantity}} / {{item_box.quantity}}</label>
            </div>
            <label id="choice-message"><str string-id="1427">Choose your item(s)</str></label>
            <panel id="choice-container" class="content-box">
                <listbox id="choice-list">
                    <listbox-item class="choice-item" data-for="choice : choice_list">
                        <item-slot item-actions data-attr-id="'choice-icon-' + choice.index" data-attr-item="choice.ref_key" item-quantity="0"/>
                        <div class="button-container">
                            <button data-attr-id="'choice-decrease-' + choice.index" class="left-sm" data-event-click="dec_choice(choice.index)" /><label class="textarea">{{choice.choice_quantity}}</label><button data-attr-id="'choice-increase-' + choice.index" class="right-sm" data-event-click="inc_choice(choice.index)" />
                        </div>
                    </listbox-item>
                </listbox>
            </panel>
            <button class="default ice-primary" id="confirm" onclick="confirm">
                <str string-id="858">Confirm</str>
            </button>
        </div>
        <div class="ice-fx ice-tl"></div>
        <div class="ice-fx ice-br"></div>
    </body>
</rml>
