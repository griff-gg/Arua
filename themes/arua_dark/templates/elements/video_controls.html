<div id="v_error">Couldn't load video</div>

<div id="v_controls" class="video-controls">
    <div id="v_play"
         class="video-controls__button"
         data-label-play="Play"
         data-label-pause="Pause"
         data-label-replay="Replay">Play</div>

    <div id="v_seek" class="video-controls__track video-controls__seek">
        <div id="v_seek_fill" class="video-controls__fill"></div>
        <div id="v_seek_thumb" class="video-controls__thumb video-controls__seek-thumb"></div>
    </div>

    <div id="v_time"
         class="video-controls__time"
         data-time-template="{current} / {duration}"
         data-label-unavailable="--:--">0:00 / 0:00</div>

    <div id="v_mute"
         class="video-controls__button video-controls__mute"
         data-label-mute="Mute"
         data-label-unmute="Unmute">Mute</div>

    <div id="v_vol" class="video-controls__track video-controls__volume">
        <div id="v_vol_fill" class="video-controls__fill video-controls__volume-fill"></div>
        <div id="v_vol_thumb" class="video-controls__thumb video-controls__volume-thumb"></div>
    </div>
</div>
